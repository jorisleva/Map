name: iOS · TestFlight

# Déclenchement :
#  - MANUEL depuis l'onglet Actions (bouton "Run workflow") — disponible une fois
#    le workflow présent sur la branche par défaut.
#  - AUTO sur push de la branche de dev, UNIQUEMENT si le message de commit
#    contient "[build-ios]" (voir le garde `if:` ci-dessous). Un commit normal ne
#    déclenche donc pas de build.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS"
        default: production
        type: choice
        options:
          - production
          - preview
  push:
    branches:
      - claude/expo-openstreetmap-mistral-vs7f5f

jobs:
  build-submit:
    name: Build iOS + envoi TestFlight
    # Ne build que sur déclenchement manuel, ou push marqué "[build-ios]".
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-ios]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Build sur les serveurs EAS, puis soumission automatique à TestFlight
      # (profil "production"). Les identifiants Apple et la clé Mistral vivent
      # côté EAS (voir TESTFLIGHT.md) — aucun secret Apple n'est requis ici.
      # Push (marqueur [build-ios]) → build "production" + envoi TestFlight
      # (chemin le plus simple sans ordinateur). Dispatch manuel "preview" →
      # distribution interne. Les deux exigent le certificat iOS configuré côté EAS.
      - name: Build & submit
        run: |
          if [ "${{ inputs.profile }}" = "preview" ]; then
            eas build --platform ios --profile preview --non-interactive
          else
            eas build --platform ios --profile production --non-interactive --auto-submit
          fi
